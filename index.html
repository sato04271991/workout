<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout App</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
}

h1 {
  margin: 20px 0;
}

.container {
  max-width: 400px;
  margin: auto;
}

button {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #00c853;
  color: white;
}

button:active {
  background: #009624;
}

.card {
  background: #222;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

.timer {
  font-size: 40px;
  margin-top: 10px;
}
</style>
</head>

<body>

<h1>Workout</h1>

<div class="container">

<button onclick="startWorkout()">スタート</button>

<div class="card">
  <div>現在の種目</div>
  <div id="exercise">待機中</div>
</div>

<div class="card">
  <div>タイマー</div>
  <div class="timer" id="timer">0</div>
</div>

</div>

<script>
let exercises = ["腕立て", "スクワット", "腹筋", "休憩"];
let index = 0;
let time = 0;
let interval;

function startWorkout() {
  index = 0;
  nextExercise();
}

function nextExercise() {
  clearInterval(interval);

  document.getElementById("exercise").innerText = exercises[index];
  time = 10;
  updateTimer();

  interval = setInterval(() => {
    time--;
    updateTimer();

    if (time <= 0) {
      index++;
      if (index >= exercises.length) {
        document.getElementById("exercise").innerText = "終了";
        clearInterval(interval);
        return;
      }
      nextExercise();
    }
  }, 1000);
}

function updateTimer() {
  document.getElementById("timer").innerText = time;
}
</script>

</body>
</html>
