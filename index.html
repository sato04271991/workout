<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鍛錬</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    text-align: center;
    margin: 0;
    background: #f5f5f5;
}

h1 {
    margin-top: 20px;
}

button {
    font-size: 20px;
    padding: 15px 30px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    background: #007AFF;
    color: white;
}

#count {
    font-size: 80px;
    margin: 20px 0;
}
</style>
</head>

<body>

<h1>鍛錬</h1>

<div id="count">0</div>

<button onclick="add()">＋</button>
<button onclick="reset()">リセット</button>

<script>
let count = 0;

function add() {
    count++;
    document.getElementById("count").innerText = count;
}

function reset() {
    count = 0;
    document.getElementById("count").innerText = count;
}
</script>

</body>
</html>
